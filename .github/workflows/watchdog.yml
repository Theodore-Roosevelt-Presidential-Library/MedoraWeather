name: Watchdog — published feed freshness

# Deliberately independent of deploy.yml. It judges the pipeline only by what
# is actually published at the public URL, so it cannot be fooled by the
# pipeline's internal state.
#
# This exists because of the Aug 2026 outage: run #681 sat in "Waiting" for
# 1d22h holding the `pages` concurrency lock. Nothing inside deploy.yml could
# report that — `timeout-minutes` does not apply to a job that never starts,
# and a failure-notification job never fires on a run that never finishes.
# Two days of frozen weather data went unnoticed. An outside observer that
# only looks at the published artifact catches every version of this.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Needed to cancel stalled runs and re-dispatch the deploy. Scoped to this
  # repo's Actions only. See the remediation step for the guardrails on what
  # it is allowed to touch.
  actions: write

# No `pages` group, no environment, no dependency on the deploy workflow —
# nothing here can be blocked by a stuck deploy. cancel-in-progress is safe
# because the check is idempotent, and it means the watchdog can never form
# the same queue that jammed deploy.yml.
concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the published feed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # Derive both the URL and the threshold from config.json so this
          # never drifts out of sync with the real refresh cadence.
          base=$(jq -r '.site.baseUrl' config.json)
          refresh=$(jq -r '.cache.refreshMinutes' config.json)
          feed="${base%/}/data/meta.json"

          # Four missed refreshes before crying wolf, floored at 60 minutes.
          # GitHub's scheduled runs are best-effort and routinely drift 10-15
          # minutes under load, so a tighter window produces false alarms.
          threshold=$(( refresh * 4 ))
          [ "$threshold" -lt 60 ] && threshold=60

          echo "feed=$feed threshold=${threshold}m"

          status=healthy
          detail=""

          if ! body=$(curl -fsSL --max-time 30 "$feed" 2>/dev/null); then
            status=unreachable
            detail="\`$feed\` could not be fetched. The site itself may be down, not just stale."
          else
            generated=$(printf '%s' "$body" | jq -r '.generatedAt // empty')
            if [ -z "$generated" ]; then
              status=malformed
              detail="Feed fetched but contains no \`generatedAt\` field. A build may have published a truncated file."
            else
              age=$(( ( $(date -u +%s) - $(date -u -d "$generated" +%s) ) / 60 ))
              if [ "$age" -gt "$threshold" ]; then
                status=stale
                detail="Published data is **${age} minutes old** (threshold ${threshold}m). Last generated \`${generated}\`."
              else
                detail="Published data is ${age} minutes old (threshold ${threshold}m)."
              fi
            fi
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "detail<<WATCHDOG_EOF"
            echo "$detail"
            echo "WATCHDOG_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "### Watchdog: \`$status\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$detail" >> "$GITHUB_STEP_SUMMARY"

      - name: Clear stalled runs and restart the pipeline
        id: heal
        if: ${{ steps.check.outputs.status != 'healthy' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # A deploy takes ~4 minutes. Anything that has not started after 45
          # is not going to; that is dead weight holding the `pages` lock.
          STALL_MINUTES: "45"
        run: |
          set -uo pipefail
          log=""

          # GUARDRAILS — this step may only ever:
          #   * touch runs of deploy.yml (never another workflow)
          #   * touch runs in `queued` or `waiting` (never `in_progress`, so a
          #     genuinely executing build is never interrupted)
          #   * touch runs older than STALL_MINUTES
          # A run matching all three is, by definition, doing no work.
          for state in queued waiting; do
            ids=$(gh run list --repo "$REPO" --workflow deploy.yml \
                    --status "$state" --limit 50 \
                    --json databaseId,createdAt \
                    --jq '.[] | "\(.databaseId) \(.createdAt)"' 2>/dev/null || true)
            [ -z "$ids" ] && continue

            while read -r id created; do
              [ -z "${id:-}" ] && continue
              age=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 60 ))
              if [ "$age" -le "$STALL_MINUTES" ]; then
                echo "run $id is $state for ${age}m — under threshold, leaving alone"
                continue
              fi

              echo "run $id stalled in $state for ${age}m — cancelling"
              gh run cancel "$id" --repo "$REPO" >/dev/null 2>&1 || true
              sleep 10

              # A normal cancel does not always take on an orphaned run.
              still=$(gh run view "$id" --repo "$REPO" --json status \
                        --jq .status 2>/dev/null || echo unknown)
              if [ "$still" != "completed" ]; then
                echo "run $id did not cancel cleanly (status=$still) — force-cancelling"
                gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" \
                  >/dev/null 2>&1 || true
                log="${log}- Force-cancelled run \`#${id}\`, stalled in \`${state}\` for ${age} minutes."$'\n'
              else
                log="${log}- Cancelled run \`#${id}\`, stalled in \`${state}\` for ${age} minutes."$'\n'
              fi
            done <<< "$ids"
          done

          # Only start a fresh build if nothing is genuinely running, so the
          # watchdog can never pile dispatches on top of a working pipeline.
          running=$(gh run list --repo "$REPO" --workflow deploy.yml \
                      --status in_progress --limit 1 --json databaseId \
                      --jq 'length' 2>/dev/null || echo 0)
          if [ "$running" -eq 0 ]; then
            if gh workflow run deploy.yml --repo "$REPO" --ref main >/dev/null 2>&1; then
              log="${log}- Dispatched a fresh deploy run."$'\n'
            else
              log="${log}- Could not dispatch a deploy run; needs a look."$'\n'
            fi
          else
            log="${log}- A deploy is already in progress; did not dispatch another."$'\n'
          fi

          [ -z "$log" ] && log="- No stalled runs found to clear."$'\n'

          {
            echo "actions<<HEAL_EOF"
            printf '%s' "$log"
            echo "HEAL_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "### Remediation" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$log" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or resolve the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STATUS: ${{ steps.check.outputs.status }}
          DETAIL: ${{ steps.check.outputs.detail }}
          HEAL_LOG: ${{ steps.heal.outputs.actions }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml
        run: |
          set -euo pipefail

          existing=$(gh issue list --repo "$REPO" --label feed-stale --state open \
            --json number --jq '.[0].number // empty')

          if [ "$STATUS" = "healthy" ]; then
            # Self-resolving: close the alert once the feed recovers.
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "Recovered. $DETAIL"$'\n\n'"Closing automatically."
              gh issue close "$existing" --repo "$REPO"
            fi
            exit 0
          fi

          # Already reported — stay quiet rather than commenting every hour.
          if [ -n "$existing" ]; then
            echo "Alert issue #$existing already open; not duplicating."
            exit 0
          fi

          body=$(printf '%s\n' \
            "The published Medora Weather feed is not updating." \
            "" \
            "**Status:** \`$STATUS\`" \
            "" \
            "$DETAIL" \
            "" \
            "### Already attempted automatically" \
            "" \
            "$HEAL_LOG" \
            "" \
            "If that cleared it, the next watchdog pass closes this issue on its" \
            "own and no action is needed. This issue exists so the repair is" \
            "never silent." \
            "" \
            "Watchdog run: $RUN_URL" \
            "Deploy history: $ACTIONS_URL" \
            "" \
            "---" \
            "" \
            "Embedded widgets keep serving the last good forecast and show a" \
            "\"data delayed\" note, so nothing on trlibrary.com goes blank — but" \
            "the weather shown is frozen until this clears." \
            "" \
            "**If it is still stale on the next pass**, the jam is something the" \
            "watchdog cannot clear on its own. Open the deploy history and check" \
            "whether runs are failing to acquire a runner, or whether the" \
            "\`github-pages\` environment is gating deployments." \
            "" \
            "This issue closes itself once the feed is fresh again.")

          gh label create feed-stale --repo "$REPO" --color B60205 \
            --description "Published weather feed is stale or unreachable" 2>/dev/null || true

          gh issue create --repo "$REPO" --label feed-stale \
            --title "Medora Weather feed is not updating" --body "$body"
