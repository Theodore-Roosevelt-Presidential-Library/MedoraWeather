name: Build and deploy Medora Weather

on:
  # Refresh every ~30 minutes. NWS observations publish roughly hourly, so this
  # stays ahead of the source while leaving headroom: a run takes ~30 seconds,
  # so the queue has ~60x slack before scheduled runs can start stepping on
  # each other. (GitHub delays scheduled runs under load — best-effort, not a
  # life-safety channel.)
  schedule:
    - cron: "*/30 * * * *"
  # Rebuild on pushes to main (code/style changes).
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  # Build is deliberately OUTSIDE the `pages` concurrency group. If a runner is
  # slow to be acquired, the build stalls on its own without holding the deploy
  # lock — which is what turned a runner outage into 100+ self-cancelling runs
  # in Aug 2026.
  build:
    runs-on: ubuntu-latest
    # A healthy build takes ~30s. Ten minutes is generous; anything beyond it
    # means the runner never showed up, and we want that to fail loudly and
    # fast rather than idle until the next schedule supersedes it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build site (fetch NWS + render widget and images)
        run: npm run build

      - name: Verify build produced fresh data
        run: |
          set -euo pipefail
          generated=$(node -p "require('./site/data/meta.json').generatedAt")
          age=$(( ($(date -u +%s) - $(date -u -d "$generated" +%s)) / 60 ))
          echo "forecast generatedAt=$generated (${age}m old)"
          if [ "$age" -gt 60 ]; then
            echo "::error::Build wrote data that is ${age} minutes old — NWS fetch likely fell back to cache."
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the actual Pages deployment is serialized. Never interrupt a deploy
    # that is already in flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Scheduled-workflow failures email the cron's author, but CANCELLED runs
  # notify nobody — which is why the Aug 2026 outage stayed silent for two days
  # while ~100 runs cancelled each other. This catches both and files a single
  # deduplicated issue.
  alert-on-breakage:
    needs: [build, deploy]
    if: ${{ always() && (contains(fromJSON('["failure","cancelled"]'), needs.build.result) || contains(fromJSON('["failure","cancelled"]'), needs.deploy.result)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the pipeline-down issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --label pipeline-down --state open \
            --json number --jq '.[0].number // empty')

          body=$(printf '%s\n' \
            "The Medora Weather build/deploy pipeline is not completing." \
            "" \
            "- build: \`$BUILD_RESULT\`" \
            "- deploy: \`$DEPLOY_RESULT\`" \
            "- run: $RUN_URL" \
            "" \
            "Embedded widgets keep serving the last good forecast and show a" \
            "\"data delayed\" note, so nothing is blank — but the data is frozen" \
            "until this clears." \
            "" \
            "If the run shows \"job was not acquired by Runner of type hosted\"," \
            "check Org Settings -> Actions -> Standard hosted runners.")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh label create pipeline-down --repo "$REPO" \
              --color B60205 --description "Weather pipeline is not deploying" 2>/dev/null || true
            gh issue create --repo "$REPO" --label pipeline-down \
              --title "Medora Weather pipeline is down" --body "$body"
          fi
